services:
  # Message Broker RabbitMQ 4 com Painel de Gestão (Porta 5672 AMQP e 15672 Management UI)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: atlas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - atlas-net

  # 1. Compute Service (Parte 1: API REST de Instâncias Virtuais - Porta Interna 8081)
  compute:
    build:
      context: .
      target: compute
    container_name: atlas-compute
    environment:
      PORT: 8081
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas-net

  # 2. Security Service (Parte 1: API REST de Security Groups & Firewall - Porta Interna 8082)
  security:
    build:
      context: .
      target: security
    container_name: atlas-security
    environment:
      PORT: 8082
      COMPUTE_SERVICE_URL: http://compute:8081
    depends_on:
      compute:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas-net

  # 3. Billing Service (Parte 1: API REST de Orçamento e Bilhetagem - Porta Interna 8083)
  billing:
    build:
      context: .
      target: billing
    container_name: atlas-billing
    environment:
      PORT: 8083
      COMPUTE_SERVICE_URL: http://compute:8081
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      compute:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas-net

  # 4. Mensageria Workers (Parte 2: Consumidores de Notificação e Auditoria, Retry, DLQ e Idempotência)
  workers:
    build:
      context: .
      target: workers
    container_name: atlas-workers
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - atlas-net

  # 5. GraphQL BFF Service (Parte 3: Servidor GraphQL com DataLoader e Mutation - Porta Interna 8084)
  graphql:
    build:
      context: .
      target: graphql
    container_name: atlas-graphql
    environment:
      PORT: 8084
      COMPUTE_SERVICE_URL: http://compute:8081
      SECURITY_SERVICE_URL: http://security:8082
      BILLING_SERVICE_URL: http://billing:8083
    depends_on:
      compute:
        condition: service_healthy
      security:
        condition: service_healthy
      billing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas-net

  # 6. API Gateway Resiliente (Parte 4: Única Porta Pública 8080 + Frontend Estático Integrado)
  gateway:
    build:
      context: .
      target: gateway
    container_name: atlas-gateway
    environment:
      PORT: 8080
      COMPUTE_SERVICE_URL: http://compute:8081
      SECURITY_SERVICE_URL: http://security:8082
      BILLING_SERVICE_URL: http://billing:8083
      GRAPHQL_SERVICE_URL: http://graphql:8084
      STATIC_DIR: /app/frontend
      UPSTREAM_TIMEOUT_MS: 2000
    ports:
      - "8080:8080"
    depends_on:
      compute:
        condition: service_healthy
      security:
        condition: service_healthy
      billing:
        condition: service_healthy
      graphql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas-net

networks:
  atlas-net:
    name: atlas-cloud-network
    driver: bridge
